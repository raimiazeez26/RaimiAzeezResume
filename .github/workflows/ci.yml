name: Python CI

on:
  push:
    branches: [main, stabilize-resume-dash-app]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q app.py pages sides
      - name: Smoke-test Dash startup
        run: python -c "import app; assert app.server is not None; print('Dash app imported successfully')"
